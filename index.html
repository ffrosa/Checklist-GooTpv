<script>

class Utils {
  static generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,9); }
  static formatDate(date, fmt='DD/MM/YYYY') {
    const d = new Date(date);
    const day = String(d.getDate()).padStart(2,'0');
    const month = String(d.getMonth()+1).padStart(2,'0');
    const year = d.getFullYear();
    const hours = String(d.getHours()).padStart(2,'0');
    const minutes = String(d.getMinutes()).padStart(2,'0');
    return fmt.replace('DD',day).replace('MM',month).replace('YYYY',year).replace('HH',hours).replace('mm',minutes);
  }
  static sanitizeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
  static debounce(fn, delay) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), delay); }; }
  static getPriorityColor(p) { const c = {urgent:'#7c3aed',high:'#ef4444',medium:'#f59e0b',low:'#22c55e'}; return c[p] || c.low; }
  static getPriorityLabel(p) { const l = {urgent:'Urgente',high:'Alta',medium:'Media',low:'Baja'}; return l[p] || p; }
  static getStatusConfig(s) {
    const c = {
      ok:{label:'OK',color:'#22c55e',bg:'rgba(34,197,94,0.15)',icon:'check-circle'},
      pending:{label:'Pendiente',color:'#f59e0b',bg:'rgba(234,179,8,0.15)',icon:'clock'},
      error:{label:'Fallo',color:'#ef4444',bg:'rgba(239,68,68,0.15)',icon:'x-circle'},
      na:{label:'N/A',color:'#94a3b8',bg:'rgba(148,163,184,0.15)',icon:'minus-circle'},
      progress:{label:'En Curso',color:'#3b82f6',bg:'rgba(59,130,246,0.15)',icon:'loader'}
    };
    return c[s] || c.pending;
  }
}

class StorageManager {
  constructor() {
    this.prefix = 'gootpv_';
    this.version = '2.0.0';
    this.schema = {
      clients: [], equipment: [], checklists: [], tasks: [],
      categories: [
        {id:'cat_1',name:'Hardware',color:'#ef4444'},{id:'cat_2',name:'Software',color:'#3b82f6'},
        {id:'cat_3',name:'Red',color:'#22c55e'},{id:'cat_4',name:'Impresoras',color:'#f59e0b'},
        {id:'cat_5',name:'Caja',color:'#8b5cf6'},{id:'cat_6',name:'Perifericos',color:'#ec4899'},
        {id:'cat_7',name:'Servidor',color:'#06b6d4'},{id:'cat_8',name:'Seguridad',color:'#f97316'}
      ],
      settings: {theme:'auto',language:'es',autoSave:true,backupEnabled:true,backupInterval:30},
      activityLog: []
    };
    this.init();
  }
  init() {
    const stored = localStorage.getItem(this.prefix + 'data');
    if (!stored) { this.save(this.schema); this.logActivity('Sistema inicializado','info'); }
    else { this.migrateIfNeeded(); }
  }
  migrateIfNeeded() {
    const data = this.getAll();
    if (!data.version || data.version !== this.version) {
      data.version = this.version;
      if (!data.activityLog) data.activityLog = [];
      if (!data.settings) data.settings = this.schema.settings;
      this.save(data);
      this.logActivity('Migracion a version ' + this.version,'info');
    }
  }
  getAll() { try { return JSON.parse(localStorage.getItem(this.prefix + 'data')) || this.schema; } catch { return this.schema; } }
  save(data) { localStorage.setItem(this.prefix + 'data', JSON.stringify(data)); }
  get(key) { return this.getAll()[key]; }
  set(key, value) { const d = this.getAll(); d[key] = value; this.save(d); }
  addItem(col, item) {
    const d = this.getAll();
    item.id = item.id || Utils.generateId();
    item.createdAt = item.createdAt || new Date().toISOString();
    item.updatedAt = new Date().toISOString();
    d[col].push(item); this.save(d);
    this.logActivity(col + ': item agregado','success');
    return item;
  }
  updateItem(col, id, updates) {
    const d = this.getAll();
    const idx = d[col].findIndex(i => i.id === id);
    if (idx !== -1) { d[col][idx] = {...d[col][idx],...updates,updatedAt:new Date().toISOString()}; this.save(d); this.logActivity(col + ': item actualizado','info'); return d[col][idx]; }
    return null;
  }
  deleteItem(col, id) { const d = this.getAll(); d[col] = d[col].filter(i => i.id !== id); this.save(d); this.logActivity(col + ': item eliminado','warning'); }
  logActivity(msg, type='info') {
    const d = this.getAll();
    d.activityLog.unshift({id:Utils.generateId(),message:msg,type,timestamp:new Date().toISOString()});
    if (d.activityLog.length > 100) d.activityLog = d.activityLog.slice(0,100);
    this.save(d);
  }
  exportAll() { return JSON.stringify(this.getAll(),null,2); }
  importAll(json) { try { const d = JSON.parse(json); this.save(d); this.logActivity('Datos importados correctamente','success'); return true; } catch { return false; } }
  resetAll() { localStorage.removeItem(this.prefix + 'data'); this.init(); this.logActivity('Datos restablecidos','warning'); }
  createBackup() {
    const data = this.exportAll();
    const blob = new Blob([data],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'gootpv_backup_' + Utils.formatDate(new Date(),'YYYY-MM-DD') + '.json';
    a.click(); URL.revokeObjectURL(url);
    this.logActivity('Backup creado manualmente','success');
  }
}

class ThemeManager {
  constructor() { this.storage = app.storage; this.init(); }
  init() { const s = this.storage.get('settings'); this.applyTheme(s.theme || 'auto'); }
  applyTheme(theme) {
    const html = document.documentElement;
    if (theme === 'dark') html.classList.add('dark');
    else if (theme === 'light') html.classList.remove('dark');
    else { window.matchMedia('(prefers-color-scheme: dark)').matches ? html.classList.add('dark') : html.classList.remove('dark'); }
    const icon = document.getElementById('themeIcon');
    const text = document.querySelector('#themeToggle .nav-text');
    if (icon) { icon.setAttribute('data-lucide', theme === 'dark' ? 'sun' : 'moon'); lucide.createIcons(); }
    if (text) text.textContent = theme === 'dark' ? 'Tema Claro' : 'Tema Oscuro';
  }
  toggle() {
    const s = this.storage.get('settings');
    const current = s.theme || 'auto';
    const next = current === 'dark' ? 'light' : (current === 'light' ? 'auto' : 'dark');
    s.theme = next; this.storage.set('settings', s); this.applyTheme(next);
    app.notifications.show('Tema cambiado a: ' + (next === 'auto' ? 'Automatico' : (next === 'dark' ? 'Oscuro' : 'Claro')), 'info');
  }
}

class NotificationManager {
  show(message, type='info', duration=4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    const icons = {success:'check-circle',error:'alert-circle',warning:'alert-triangle',info:'info'};
    const colors = {
      success:'border-l-emerald-500 bg-emerald-50 dark:bg-emerald-900/20',
      error:'border-l-red-500 bg-red-50 dark:bg-red-900/20',
      warning:'border-l-amber-500 bg-amber-50 dark:bg-amber-900/20',
      info:'border-l-primary-500 bg-primary-50 dark:bg-primary-900/20'
    };
    const textColors = {success:'text-emerald-600',error:'text-red-600',warning:'text-amber-600',info:'text-primary-600'};

        ]}

    checklist.progress = 0;
    return this.storage.addItem(this.collection, checklist);
  }
  update(id, updates) { return this.storage.updateItem(this.collection, id, updates); }
  delete(id) { this.storage.deleteItem(this.collection, id); }
  updateItemStatus(checklistId, catIdx, itemIdx, status) {
    const checklist = this.getById(checklistId);
    if (!checklist || !checklist.categories[catIdx]) return null;
    checklist.categories[catIdx].items[itemIdx].status = status;
    checklist.progress = this.calculateProgress(checklist);
    checklist.updatedAt = new Date().toISOString();
    const d = this.storage.getAll();
    const idx = d.checklists.findIndex(c => c.id === checklistId);
    if (idx !== -1) { d.checklists[idx] = checklist; this.storage.save(d); }
    return checklist;
  }
  calculateProgress(checklist) {
    let total = 0, completed = 0;
    checklist.categories.forEach(cat => { cat.items.forEach(item => { total++; if (item.status === 'ok') completed++; }); });
    return total > 0 ? Math.round((completed / total) * 100) : 0;
  }

    const checklists = this.getAll();
    return { total: checklists.length, completed: checklists.filter(c => c.progress === 100).length, inProgress: checklists.filter(c => c.progress > 0 && c.progress < 100).length, pending: checklists.filter(c => c.progress === 0).length, avgProgress: checklists.length > 0 ? Math.round(checklists.reduce((a,c) => a + (c.progress || 0), 0) / checklists.length) : 0 };
  }
}

class TaskManager {
  constructor() { this.storage = app.storage; this.collection = 'tasks'; }
  getAll() { return this.storage.get(this.collection) || []; }
  getById(id) { return this.getAll().find(t => t.id === id); }
  getToday() { const today = Utils.formatDate(new Date(), 'YYYY-MM-DD'); return this.getAll().filter(t => t.dueDate && t.dueDate.startsWith(today)); }
  getOverdue() { const now = new Date(); return this.getAll().filter(t => { if (t.status === 'completed' || !t.dueDate) return false; return new Date(t.dueDate) < now; }); }
  search(query) {
    const q = query.toLowerCase();
    return this.getAll().filter(t => (t.title && t.title.toLowerCase().includes(q)) || (t.description && t.description.toLowerCase().includes(q)) || (t.category && t.category.toLowerCase().includes(q)) || (t.tags && t.tags.some(tag => tag.toLowerCase().includes(q))));
  }
  add(task) { task.status = task.status || 'pending'; task.priority = task.priority || 'medium'; return this.storage.addItem(this.collection, task); }
  update(id, updates) { return this.storage.updateItem(this.collection, id, updates); }
  delete(id) { this.storage.deleteItem(this.collection, id); }
  toggleStatus(id) {
    const task = this.getById(id);
    if (task) { const newStatus = task.status === 'completed' ? 'pending' : 'completed'; return this.update(id, {status: newStatus, completedAt: newStatus === 'completed' ? new Date().toISOString() : null}); }
    return null;
  }
  getStats() {
    const tasks = this.getAll();
    return { total: tasks.length, pending: tasks.filter(t => t.status === 'pending').length, completed: tasks.filter(t => t.status === 'completed').length, overdue: this.getOverdue().length, today: this.getToday().length, byPriority: {urgent: tasks.filter(t => t.priority === 'urgent').length, high: tasks.filter(t => t.priority === 'high').length, medium: tasks.filter(t => t.priority === 'medium').length, low: tasks.filter(t => t.priority === 'low').length} };

}

  getMonthData() {
    const year = this.currentDate.getFullYear(), month = this.currentDate.getMonth();
    const firstDay = new Date(year, month, 1), lastDay = new Date(year, month + 1, 0);
    const startPadding = firstDay.getDay(), daysInMonth = lastDay.getDate();
    const days = []; for (let i = 0; i < startPadding; i++) days.push(null); for (let i = 1; i <= daysInMonth; i++) days.push(i);

class ImportExportManager {
  exportJSON() {
    const data = app.storage.exportAll();
    const blob = new Blob([data],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'gootpv_export_' + Utils.formatDate(new Date(),'YYYY-MM-DD') + '.json';
    a.click(); URL.revokeObjectURL(url);
    app.notifications.show('Datos exportados en JSON','success');
  }
  exportCSV(collection) {
    const data = app.storage.get(collection) || [];
    if (data.length === 0) { app.notifications.show('No hay datos para exportar','warning'); return; }
    const headers = Object.keys(data[0]).filter(k => k !== 'id' && k !== 'createdAt' && k !== 'updatedAt');
    const csv = [headers.join(',')].concat(data.map(row => headers.map(h => { const val = row[h]; if (Array.isArray(val)) return '"' + val.join(';') + '"'; if (typeof val === 'object' && val !== null) return '"' + JSON.stringify(val).replace(/"/g,'""') + '"'; return '"' + (val || '').toString().replace(/"/g,'""') + '"'; }).join(','))).join('\n');
    const blob = new Blob(['\ufeff' + csv],{type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'gootpv_' + collection + '_' + Utils.formatDate(new Date(),'YYYY-MM-DD') + '.csv'; a.click(); URL.revokeObjectURL(url);
    app.notifications.show('Datos exportados en CSV','success');
  }
  exportExcel(collection) {
    const data = app.storage.get(collection) || [];
    if (data.length === 0) { app.notifications.show('No hay datos para exportar','warning'); return; }
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, collection);
    XLSX.writeFile(wb, 'gootpv_' + collection + '_' + Utils.formatDate(new Date(),'YYYY-MM-DD') + '.xlsx');
    app.notifications.show('Datos exportados en Excel','success');
  }
  async exportPDF(collection) {
    const {jsPDF} = window.jspdf;
    const data = app.storage.get(collection) || [];
    const doc = new jsPDF();
    doc.setFontSize(18); doc.text('GooTpv - ' + collection.toUpperCase(), 14, 20);
    doc.setFontSize(10); doc.text('Generado: ' + Utils.formatDate(new Date()), 14, 28);
    let y = 40;
    data.forEach((item, i) => {
      if (y > 270) { doc.addPage(); y = 20; }
      doc.setFontSize(11); doc.setTextColor(20,184,166); doc.text((i+1) + '. ' + (item.name || item.title || item.businessName || 'Item'), 14, y);
      doc.setTextColor(60,60,60); doc.setFontSize(9);
      const details = Object.entries(item).filter(([k]) => !['id','createdAt','updatedAt'].includes(k)).map(([k,v]) => k + ': ' + v).join(' | ');
      const split = doc.splitTextToSize(details, 180); doc.text(split, 14, y+6);
      y += 6 + (split.length * 4) + 4;
    });
    doc.save('gootpv_' + collection + '_' + Utils.formatDate(new Date(),'YYYY-MM-DD') + '.pdf');
    app.notifications.show('Datos exportados en PDF','success');
  }
  importJSON(file) {
    const reader = new FileReader();
    reader.onload = (e) => { if (app.storage.importAll(e.target.result)) { app.notifications.show('Datos importados correctamente','success'); app.ui.refreshCurrentPage(); } else { app.notifications.show('Error al importar datos','error'); } };
    reader.readAsText(file);
  }
  importExcel(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type:'array'});
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
        const collection = workbook.SheetNames[0].toLowerCase();
        const validCollections = ['clients','equipment','checklists','tasks'];
        const target = validCollections.find(c => collection.includes(c)) || 'clients';
        jsonData.forEach(item => { app.storage.addItem(target, item); });
        app.notifications.show(jsonData.length + ' registros importados a ' + target, 'success');
        app.ui.refreshCurrentPage();
      } catch { app.notifications.show('Error al importar Excel','error'); }
    };
    reader.readAsArrayBuffer(file);
  }
}

  getCalendarHTML() {

    const monthData = cal.getMonthData();
    const events = cal.getEvents();
    return '<div class="page-transition active space-y-6">' +
      '<div class="flex items-center justify-between"><div class="flex items-center gap-3"><button onclick="app.calendar.prevMonth(); app.ui.refreshCurrentPage()" class="p-2 rounded-xl hover:bg-dark-100 dark:hover:bg-dark-700 transition-colors"><i data-lucide="chevron-left" class="w-5 h-5"></i></button><h3 class="text-lg font-semibold text-dark-900 dark:text-white min-w-[180px] text-center">' + monthData.monthName + ' ' + monthData.year + '</h3><button onclick="app.calendar.nextMonth(); app.ui.refreshCurrentPage()" class="p-2 rounded-xl hover:bg-dark-100 dark:hover:bg-dark-700 transition-colors"><i data-lucide="chevron-right" class="w-5 h-5"></i></button></div><button onclick="app.calendar.goToToday(); app.ui.refreshCurrentPage()" class="px-4 py-2 rounded-xl bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400 text-sm font-medium hover:bg-primary-100 dark:hover:bg-primary-900/30 transition-colors">Hoy</button></div>' +
      '<div class="glass rounded-2xl p-5"><div class="grid grid-cols-7 gap-1 mb-2">' + ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'].map(d => '<div class="text-center text-xs font-semibold text-dark-400 py-2">' + d + '</div>').join('') + '</div><div class="grid grid-cols-7 gap-1">' +
      monthData.days.map(day => {

        const dayEvents = events.filter(e => e.date && e.date.startsWith(dateStr));
        const isToday = dateStr === Utils.formatDate(new Date(), 'YYYY-MM-DD');

  // ─── MODAL METHODS ──────────────────────────────────────────
  showModal(content, onClose) {
    const container = document.getElementById('modalContainer');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm';
    overlay.innerHTML = '<div class="modal-content glass-strong rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">' + content + '</div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) { this.closeModal(); if (onClose) onClose(); } });
    container.appendChild(overlay);
    this.modals.push(overlay);
    requestAnimationFrame(() => overlay.classList.add('active'));
    lucide.createIcons();
  }

  closeModal() {
    const modal = this.modals.pop();
    if (modal) { modal.classList.remove('active'); setTimeout(() => modal.remove(), 300); }
  }

        itemsHtml += '<div class="checklist-item ' + (item.status || 'pending') + ' rounded-xl p-3 flex items-center gap-3" onclick="app.ui.showStatusPicker('' + checklistId + '', ' + catIdx + ', ' + itemIdx + ', event)">' +

      '<span class="text-xs text-dark-400">' + (checklist.categories ? checklist.categories.reduce((a, cat) => a + cat.items.filter(i => i.status === 'ok').length, 0) : 0) + ' de ' + (checklist.categories ? checklist.categories.reduce((a, cat) => a + cat.items.length, 0) : 0) + ' ítems</span></div>' +

  showStatusPicker(checklistId, catIdx, itemIdx, event) {
    event.stopPropagation();
    const checklist = app.checklists.getById(checklistId);
    if (!checklist) return;
    const statuses = [
      { key: 'ok', label: 'OK', color: '#22c55e', bg: 'rgba(34,197,94,0.15)' },
      { key: 'pending', label: 'Pendiente', color: '#f59e0b', bg: 'rgba(234,179,8,0.15)' },
      { key: 'error', label: 'Fallo', color: '#ef4444', bg: 'rgba(239,68,68,0.15)' },
      { key: 'na', label: 'N/A', color: '#94a3b8', bg: 'rgba(148,163,184,0.15)' },
      { key: 'progress', label: 'En Curso', color: '#3b82f6', bg: 'rgba(59,130,246,0.15)' }
    ];
    const picker = document.createElement('div');
    picker.className = 'fixed z-[60] glass-strong rounded-xl p-2 shadow-2xl space-y-1';
    picker.style.left = event.clientX + 'px';
    picker.style.top = event.clientY + 'px';
    picker.style.minWidth = '160px';
    statuses.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'w-full flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-dark-50 dark:hover:bg-dark-700 transition-colors text-left text-sm';
      btn.innerHTML = '<div class="w-3 h-3 rounded-full" style="background: ' + s.color + '"></div><span class="text-dark-700 dark:text-dark-200">' + s.label + '</span>';
      btn.onclick = () => {
        app.checklists.updateItemStatus(checklistId, catIdx, itemIdx, s.key);
        this.closeModal(); this.showChecklistDetail(checklistId); picker.remove();
      };
      picker.appendChild(btn);
    });
    document.body.appendChild(picker);
    const closePicker = (e) => { if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener('click', closePicker); } };
    setTimeout(() => document.addEventListener('click', closePicker), 10);
  }

  handleKeyboard(e) {
    if (e.key === 'Escape') this.closeModal();
    if (e.ctrlKey || e.metaKey) {
      switch(e.key.toLowerCase()) {
        case 'n': e.preventDefault(); if (this.currentPage === 'tasks') this.showTaskModal(); else if (this.currentPage === 'clients') this.showClientModal(); else if (this.currentPage === 'equipment') this.showEquipmentModal(); else if (this.currentPage === 'checklists') this.showChecklistModal(); break;
        case 'f': e.preventDefault(); const searchInput = document.getElementById('globalSearch'); if (searchInput) searchInput.focus(); break;
        case 's': e.preventDefault(); if (this.currentPage === 'reports') app.exports.exportJSON(); else app.storage.createBackup(); app.notifications.show('Datos guardados', 'success'); break;
      }
    }
    if (!e.ctrlKey && !e.metaKey && !e.altKey) {
      const pages = ['dashboard', 'clients', 'equipment', 'checklists', 'tasks', 'calendar', 'reports', 'settings'];
      const num = parseInt(e.key); if (num >= 1 && num <= 8) this.navigateTo(pages[num - 1]);
    }
  }

  handleGlobalSearch(query) {
    if (!query.trim()) { this.refreshCurrentPage(); return; }
    const q = query.toLowerCase();
    if (this.currentPage === 'clients') { const clients = app.clients.search(q); this.updateClientsTable(clients); }
    else if (this.currentPage === 'equipment') { const equipment = app.equipment.search(q); this.refreshCurrentPage(); }
    else if (this.currentPage === 'tasks') { const tasks = app.tasks.search(q); this.refreshCurrentPage(); }
    else if (this.currentPage === 'checklists') { const checklists = app.checklists.getAll().filter(c => (c.name && c.name.toLowerCase().includes(q)) || (c.clientName && c.clientName.toLowerCase().includes(q)) || (c.technician && c.technician.toLowerCase().includes(q))); this.refreshCurrentPage(); }
  }

  updateClientsTable(clients) {
    const tbody = document.getElementById('clientsTableBody');
    if (!tbody) return;
    tbody.innerHTML = clients.length === 0 ? '<tr><td colspan="6" class="text-center py-8 text-dark-400">No se encontraron resultados</td></tr>' : clients.map(c => 
      '<tr class="border-b border-dark-100 dark:border-dark-800 hover:bg-dark-50 dark:hover:bg-dark-800/50 transition-colors"><td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center text-primary-600 dark:text-primary-400 font-semibold text-sm">' + (c.businessName || 'C').charAt(0).toUpperCase() + '</div><div><p class="font-medium text-dark-900 dark:text-white">' + Utils.sanitizeHtml(c.businessName || 'Sin nombre') + '</p><p class="text-xs text-dark-400">' + Utils.sanitizeHtml(c.legalName || '') + '</p></div></div></td>' +

      '<td class="px-6 py-4 text-dark-600 dark:text-dark-300">' + Utils.sanitizeHtml(c.city || 'N/A') + ', ' + Utils.sanitizeHtml(c.province || '') + '</td>' +
      '<td class="px-6 py-4 text-dark-600 dark:text-dark-300">' + Utils.sanitizeHtml(c.technician || 'Sin asignar') + '</td>' +
      '<td class="px-6 py-4"><span class="status-badge ' + (c.status === 'active' ? 'status-ok' : 'status-na') + '">' + (c.status === 'active' ? 'Activo' : 'Inactivo') + '</span></td>' +

  openSidebar() { document.getElementById('sidebar').classList.add('mobile-open'); document.getElementById('mobileOverlay').classList.remove('hidden'); }
  closeSidebar() { document.getElementById('sidebar').classList.remove('mobile-open'); document.getElementById('mobileOverlay').classList.add('hidden'); }

  handleDragStart(e, taskId) { e.dataTransfer.setData('text/plain', taskId); e.target.classList.add('dragging'); }
  handleDragOver(e) { e.preventDefault(); const target = e.target.closest('.priority-low, .priority-medium, .priority-high, .priority-urgent'); if (target) target.classList.add('drag-over'); }
  handleDrop(e, targetId) {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    if (draggedId === targetId) return;
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    const tasks = app.tasks.getAll();
    const draggedIdx = tasks.findIndex(t => t.id === draggedId);
    const targetIdx = tasks.findIndex(t => t.id === targetId);
    if (draggedIdx !== -1 && targetIdx !== -1) {
      const [removed] = tasks.splice(draggedIdx, 1);
      tasks.splice(targetIdx, 0, removed);
      app.storage.set('tasks', tasks);
      this.refreshCurrentPage();
    }
  }

  handleFileDrop(e) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); const files = e.dataTransfer.files; if (files.length > 0) this.processImportFile(files[0]); }
  handleFileSelect(e) { const file = e.target.files[0]; if (file) this.processImportFile(file); }
  processImportFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'json') app.exports.importJSON(file);
    else if (ext === 'xlsx' || ext === 'xls') app.exports.importExcel(file);
    else if (ext === 'csv') app.exports.importJSON(file);
    else app.notifications.show('Formato no soportado. Use JSON, Excel o CSV.', 'error');
  }

  initPage(page) {
    switch(page) {
      case 'dashboard': setTimeout(() => app.dashboard.renderCharts(), 100); break;
      case 'clients': const cs = document.getElementById('clientSearch'); if (cs) cs.addEventListener('input', Utils.debounce((e) => this.handleGlobalSearch(e.target.value), 300)); break;
      case 'equipment': const es = document.getElementById('equipmentSearch'); if (es) es.addEventListener('input', Utils.debounce((e) => this.handleGlobalSearch(e.target.value), 300)); break;
      case 'tasks': const ts = document.getElementById('taskSearch'); if (ts) ts.addEventListener('input', Utils.debounce((e) => this.handleGlobalSearch(e.target.value), 300)); break;
      case 'checklists': const cls = document.getElementById('checklistSearch'); if (cls) cls.addEventListener('input', Utils.debounce((e) => this.handleGlobalSearch(e.target.value), 300)); break;
    }
  }
}

// ─── CLASE PRINCIPAL APP ──────────────────────────────────────
class App {
  constructor() {
    this.storage = new StorageManager();
    this.theme = new ThemeManager();
    this.notifications = new NotificationManager();
    this.clients = new ClientManager();
    this.equipment = new EquipmentManager();
    this.checklists = new ChecklistManager();
    this.tasks = new TaskManager();
    this.calendar = new CalendarManager();
    this.dashboard = new DashboardManager();
    this.exports = new ImportExportManager();
    this.pwa = new PWAManager();
    this.ui = new UIManager();
    setInterval(() => { const settings = this.storage.get('settings'); if (settings.backupEnabled) this.storage.createBackup(); }, 30 * 60 * 1000);
    console.log('GooTpv System initialized');
  }
}

const app = new App();
window.gootpv = app;
